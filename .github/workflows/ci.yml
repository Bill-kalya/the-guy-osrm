name: OSRM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OSRM image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: the-guy-osrm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image runs
        run: |
          docker run --rm the-guy-osrm:ci osrm-routed --help
          docker run --rm the-guy-osrm:ci osrm-extract --help
          docker run --rm the-guy-osrm:ci osrm-partition --help
          docker run --rm the-guy-osrm:ci osrm-customize --help

  script-syntax:
    name: Shell Script Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check script syntax
        run: |
          bash -n start.sh
          bash -n prepare.sh
          bash -n preprocess-from-pbf.sh
          bash -n healthcheck.sh